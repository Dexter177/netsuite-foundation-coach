  {type:'recog',cat:'Customisation',title:'Accounting Periods & Custom Forms',
   learn:{
     headline:'Accounting periods control financial reporting windows. Custom Forms control what users see — not what data exists.',
     body:'Two separate concepts. Know each independently for the exam.',
     points:['<strong>Accounting Periods</strong> — Path: Setup → Accounting → Manage Accounting Periods. Define your fiscal calendar. A <strong>locked</strong> period prevents new transactions from posting to it. Only admins can unlock.','<strong>Custom Form</strong> — Path: Customisation → Forms → [type]. A different view of an existing record. Can hide/reorder/rename fields, set defaults, assign to roles.','<strong>Key distinction:</strong> Hiding a field on a Custom Form does NOT delete the data — it just hides it from that form. The data still exists.'],
     examFact:'"User can\'t post a journal entry to last month" → accounting period is locked. "Hide Department from Sales Reps" → Custom Form with Department hidden, assigned to the Sales Rep role.'
   },
   quiz:{questions:[
     {q:'A user tries to post a journal entry dated last month but gets an error saying the period is closed. What must an admin do?',opts:[
       {t:'Create a new Journal Entry record type',c:false,h:'The Journal Entry record type already exists — the issue is the accounting period, not the record type.'},
       {t:'Unlock (reopen) the accounting period',c:true,e:'Correct! When an accounting period is locked, no new transactions can be posted to it. An admin can unlock/reopen the period to allow the journal entry, then re-lock it after.'},
       {t:'Give the user Full permission on Journal Entries',c:false,h:'The error is about an accounting period lock — not about the user\'s permissions on the Journal Entry transaction type.'},
       {t:'Change the date on the Journal Entry to this month',c:false,h:'Changing the date might be a workaround, but it\'s not the correct fix for posting to last month.'}
     ]},
     {q:'A Sales Rep shouldn\'t see the "Cost" field on Item records. What is the correct approach?',opts:[
       {t:'Delete the Cost field from the Item record type',c:false,h:'Deleting a standard field isn\'t possible for built-in fields, and would affect ALL users — not just Sales Reps.'},
       {t:'Create a Custom Form for Item records with Cost hidden, assign it to the Sales Rep role',c:true,e:'Correct! Custom Forms let you create a role-specific view. By assigning an Item form without Cost to the Sales Rep role, they don\'t see it — but the data still exists for other roles.'},
       {t:'Lock the accounting period',c:false,h:'Locking an accounting period prevents transactions from posting to that period — completely unrelated to hiding a field.'},
       {t:'Remove the Item record type from the Sales Rep role',c:false,h:'Removing Item access entirely would prevent Sales Reps from looking up items at all — that\'s too restrictive.'}
     ]},
     {q:'A Custom Form hides the "Department" field for the Sales Rep role. Does the Department data still exist on records saved by other roles?',opts:[
       {t:'No — hiding a field on a form deletes the underlying data',c:false,h:'Custom Forms only control display — they never delete data. Hiding a field is a layout change, not a data change.'},
       {t:'Yes — Custom Forms only control display, not data storage',c:true,e:'Correct! Custom Forms are purely a display layer. Hiding Department from Sales Reps doesn\'t affect the actual field data — other roles using a different form will still see and use the Department field normally.'},
       {t:'Only if the field was created as a Custom Field',c:false,h:'This applies to all fields — standard and custom alike. Forms control display only, regardless of field type.'},
       {t:'It depends on whether the period is locked',c:false,h:'Accounting periods control transaction posting — completely unrelated to Custom Form field visibility.'}
     ]}
   ]}
  },
  {type:'recog',cat:'Platform & Reporting',title:'OneWorld & Subsidiaries',
   learn:{
     headline:'OneWorld is NetSuite\'s multi-entity edition. Subsidiaries are separate legal entities within one account.',
     body:'Many companies have multiple legal entities. OneWorld lets them share one NetSuite account while keeping separate books.',
     points:['<strong>OneWorld</strong> — the NetSuite edition supporting multiple subsidiaries','<strong>Subsidiary</strong> — a legal entity within the account. Own chart of accounts, currency, tax.','<strong>Intercompany transactions</strong> — transactions between subsidiaries. NetSuite automates matching entries on both sides.','<strong>Consolidated reporting</strong> — combines multiple subsidiaries. Eliminates intercompany transactions automatically.','<strong>Role restriction</strong> — a role can be limited to specific subsidiaries.'],
     examFact:'"Multiple legal entities in one account" = OneWorld. "Reports combining all subsidiaries" = consolidated reports. "User who can only access one country\'s data" = subsidiary-restricted role.'
   },
   quiz:{questions:[
     {q:'A company operates in the UK, US, and Germany from one NetSuite account. A UK accountant should only see UK data. What enables this?',opts:[
       {t:'Standard NetSuite with multiple roles',c:false,h:'Standard NetSuite doesn\'t support truly separate legal entity books. You need OneWorld.'},
       {t:'OneWorld with a subsidiary-restricted role',c:true,e:'Correct! OneWorld enables multiple subsidiaries in one account. The UK accountant\'s role is then restricted to the UK subsidiary — they only see UK data in reports and transactions.'},
       {t:'Multi-Currency module only',c:false,h:'Multi-Currency handles foreign exchange but doesn\'t create separate legal entity books.'},
       {t:'Advanced Financials with separate logins',c:false,h:'Separate logins = separate accounts, not one consolidated system. Advanced Financials adds budgeting, not multi-entity support.'}
     ]},
     {q:'What is the term for transactions between two subsidiaries within the same OneWorld account?',opts:[
       {t:'Cross-entity transactions',c:false,h:'"Cross-entity" is not the NetSuite term.'},
       {t:'Intercompany transactions',c:true,e:'Correct! Intercompany transactions are transactions between subsidiaries in the same OneWorld account. NetSuite can automatically generate the matching accounting entries on both sides.'},
       {t:'Multi-subsidiary entries',c:false,h:'"Multi-subsidiary entries" is not the standard NetSuite term.'},
       {t:'Consolidated entries',c:false,h:'Consolidated entries/reports combine subsidiary data for reporting — but the transactions between subsidiaries are specifically called intercompany transactions.'}
     ]},
     {q:'A report that combines financial data from the UK, US, and German subsidiaries into one view (eliminating intercompany transactions) is called a...',opts:[
       {t:'Summary report',c:false,h:'"Summary report" is a generic term, not the specific NetSuite term for this type.'},
       {t:'Consolidated report',c:true,e:'Correct! A consolidated report combines data from multiple subsidiaries into one view and automatically eliminates intercompany transactions to avoid double-counting.'},
       {t:'Global ledger report',c:false,h:'"Global ledger report" is not a standard NetSuite report type.'},
       {t:'Multi-currency report',c:false,h:'Multi-currency relates to foreign exchange — not the combination of subsidiary data into one view.'}
     ]}
   ]}
  },
  {type:'recog',cat:'Platform & Reporting',title:'SuiteAnalytics Workbooks',
   learn:{
     headline:'SuiteAnalytics Workbooks are a drag-and-drop analytics tool — more flexible than Saved Searches for ad-hoc analysis.',
     body:'Saved Searches are great for operational lists. For pivot tables, charts, and complex cross-record analysis, use <strong>SuiteAnalytics Workbooks</strong>.',
     points:['<strong>Where:</strong> Analytics → Workbooks (top navigation)','<strong>What:</strong> Drag-and-drop pivot tables, visualisations, cross-record data exploration','<strong>Different from Saved Searches:</strong> More flexible and visual — but not for operational lists or dashboard portlets','<strong>Dataset:</strong> A Workbook is built on a Dataset (defined set of records and fields). Multiple Workbooks can share one Dataset.','<strong>Still live data</strong> — not cached/historical like a Report'],
     examFact:'"Drag-and-drop pivot table" = SuiteAnalytics Workbook. "Real-time list of specific records" = Saved Search. "Period-based financial statement" = Report. Three different tools for three different jobs.'
   },
   quiz:{questions:[
     {q:'An analyst wants a drag-and-drop pivot table showing sales by region, rep, and product with a chart. Which tool?',opts:[
       {t:'Saved Search with Summary types',c:false,h:'Saved Searches can do summaries but not true pivot tables or visual charts in a drag-and-drop interface.'},
       {t:'Report Builder',c:false,h:'Report Builder creates period-based financial reports — not drag-and-drop pivot analysis.'},
       {t:'SuiteAnalytics Workbook',c:true,e:'Correct! SuiteAnalytics Workbooks are NetSuite\'s drag-and-drop analytics tool — perfect for pivot tables and charts across multiple dimensions.'},
       {t:'KPI Portlet',c:false,h:'A KPI portlet shows a single number — not a multi-dimensional pivot table.'}
     ]},
     {q:'A SuiteAnalytics Workbook is built on top of what object that defines the available records and fields?',opts:[
       {t:'A Saved Search',c:false,h:'Workbooks are not built on Saved Searches — they have their own data layer.'},
       {t:'A Dataset',c:true,e:'Correct! A Workbook is built on a Dataset — a defined collection of records, fields, and joins. Multiple Workbooks can use the same Dataset, and you can share Datasets across teams.'},
       {t:'A Report',c:false,h:'Reports and Workbooks are separate tools. Workbooks are built on Datasets, not Reports.'},
       {t:'An Accounting Period',c:false,h:'Accounting periods are financial time windows — not the data definition layer for Workbooks.'}
     ]},
     {q:'You need real-time operational data showing which orders shipped today as a list. Saved Search or SuiteAnalytics Workbook?',opts:[
       {t:'SuiteAnalytics Workbook — it\'s more powerful',c:false,h:'Power isn\'t the deciding factor — fit is. Workbooks are for ad-hoc pivot analysis. A simple real-time operational list is exactly what Saved Searches are designed for.'},
       {t:'Saved Search',c:true,e:'Correct! Operational lists (show me records matching these criteria right now) = Saved Search. Ad-hoc pivot analysis = Workbook. Use the right tool for the job.'},
       {t:'Income Statement Report',c:false,h:'Income Statements are period-based financial reports — not operational shipping lists.'},
       {t:'Either — they produce the same result',c:false,h:'They don\'t produce the same result. Saved Searches return lists of records. Workbooks return pivot tables and charts. Different outputs for different use cases.'}
     ]}
   ]}
  }
];

// ─── STATE ───────────────────────────────────────────────────────────
let ci=0,pi=0;
let doChecks={};   // ci -> bool[]
let quizQ={};      // ci -> current question index (0,1,2)
let quizSel={};    // ci -> selected answer index for current question
let quizDone={};   // ci -> bool[] (which questions passed)
let quizPassed={}; // ci -> all questions passed

function pages(c){return c.type==='deep'?['learn','do','quiz']:['learn','quiz'];}
function pt(){return pages(C[ci])[pi];}
function numQ(c){return c.quiz.questions.length;}

// ─── LOCALSTORAGE ────────────────────────────────────────────────────
const SK='ns_coach_v3';
function save(){
  try{
    localStorage.setItem(SK,JSON.stringify({ci,pi,doChecks,quizQ,quizSel,quizDone,quizPassed}));
    const pill=document.getElementById('savePill');
    if(pill){pill.classList.remove('hidden');clearTimeout(pill._t);pill._t=setTimeout(()=>pill.classList.add('hidden'),2000);}
  }catch(e){}
}
function load(){
  try{
    const d=localStorage.getItem(SK);
    if(!d)return;
    const s=JSON.parse(d);
    ci=s.ci||0;pi=s.pi||0;
    doChecks=s.doChecks||{};quizQ=s.quizQ||{};quizSel=s.quizSel||{};
    quizDone=s.quizDone||{};quizPassed=s.quizPassed||{};
  }catch(e){}
}

// ─── RENDER ──────────────────────────────────────────────────────────
function render(){
  const c=C[ci],p=pt();
  let h='';
  const meta=`<div class="concept-meta">${c.cat}</div>`;
  const num=`<div class="concept-num-badge">Concept ${ci+1} of ${C.length}</div>`;

  if(p==='learn'){
    h+=`<div class="page-badge badge-learn"><span class="badge-dot"></span>LEARN</div>`;
    h+=meta+`<h1>${c.title}</h1>`+num;
    h+=`<div class="learn-headline">${c.learn.headline}</div>`;
    h+=`<div class="learn-body">${c.learn.body}</div>`;
    if(c.learn.points)h+=`<ul class="key-points">${c.learn.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;
    h+=`<div class="exam-fact"><b>📌 Exam note</b>${c.learn.examFact}</div>`;

  }else if(p==='do'){
    h+=`<div class="page-badge badge-do"><span class="badge-dot"></span>DO IT NOW</div>`;
    h+=meta+`<h1>${c.title}</h1>`+num;
    h+=`<div class="do-intro">🛠️ ${c.do.intro}</div>`;
    if(!doChecks[ci])doChecks[ci]=new Array(c.do.steps.length).fill(false);
    h+=`<ul class="step-list">`;
    c.do.steps.forEach((s,i)=>{
      const done=doChecks[ci][i];
      h+=`<li class="step-item${done?' done':''}" onclick="toggleStep(${i})">
        <div class="step-check"><span class="step-tick">✓</span></div>
        <div class="step-num">${i+1}</div>
        <div class="step-content">
          <div class="step-title">${s.title}</div>
          ${s.detail?`<div class="step-detail">${s.detail}</div>`:''}
          ${s.path?`<span class="step-path">📍 ${s.path}</span>`:''}
        </div></li>`;
    });
    h+=`</ul>`;
    const allDone=doChecks[ci]&&doChecks[ci].every(Boolean);
    h+=`<div class="do-gate${allDone?' unlocked':''}">${allDone?'✅ All steps done — click Next to continue.':'Tick each step as you complete it in NetSuite to unlock Next.'}</div>`;

  }else if(p==='quiz'){
    h+=`<div class="page-badge badge-quiz"><span class="badge-dot"></span>QUIZ</div>`;
    h+=meta+`<h1>${c.title}</h1>`+num;
    const nq=numQ(c);
    const qi=quizQ[ci]||0;
    const done=quizDone[ci]||new Array(nq).fill(false);
    // Step pills
    h+=`<div class="quiz-header"><div class="quiz-step-pills">`;
    for(let i=0;i<nq;i++){
      let cls='qpill';
      if(done[i])cls+=' passed';
      else if(i===qi)cls+=' active';
      h+=`<div class="${cls}">${i+1}</div>`;
    }
    h+=`</div><div class="quiz-progress-label">Question ${qi+1} of ${nq}</div></div>`;

    if(quizPassed[ci]){
      h+=`<div style="text-align:center;padding:40px 20px">
        <div style="font-size:48px;margin-bottom:12px">🎉</div>
        <div style="font-size:20px;font-weight:700;color:var(--green);margin-bottom:8px">All ${nq} questions correct!</div>
        <div style="font-size:14px;color:var(--dim)">Click Next to continue to the next concept.</div>
      </div>`;
    }else{
      const q=c.quiz.questions[qi];
      const sel=quizSel[ci];
      h+=`<div class="quiz-q">${q.q}</div><div class="quiz-options">`;
      const L=['A','B','C','D'];
      q.opts.forEach((o,i)=>{
        let cls='quiz-opt';
        if(sel!==undefined){cls+=' locked';if(i===sel)cls+=o.c?' correct':' wrong';}
        h+=`<div class="${cls}" onclick="answerQuiz(${i})"><span class="opt-letter">${L[i]}</span>${o.t}</div>`;
      });
      h+=`</div>`;
      if(sel!==undefined){
        const o=q.opts[sel];
        if(o.c){
          h+=`<div class="quiz-feedback fb-right show"><div class="fb-title">✓ Correct!</div>${o.e}</div>`;
          if(qi<nq-1){
            h+=`<button class="next-q-btn show" onclick="nextQuestion()">Next Question →</button>`;
          }
        }else{
          h+=`<div class="quiz-feedback fb-wrong show"><div class="fb-title">✗ Not quite</div>${o.h}<br><br><strong style="color:var(--orange2)">Try again.</strong></div>`;
        }
      }
    }
  }

  document.getElementById('mainArea').innerHTML=h;
  updateBar();window.scrollTo({top:0,behavior:'smooth'});
}

function updateBar(){
  const c=C[ci],p=pt(),ps=pages(c);
  const nq=numQ(c);
  const qi=quizQ[ci]||0;
  // Progress: each concept page + each quiz question counts
  let done=0,total=0;
  C.forEach((cc,i)=>{
    const pp=pages(cc);
    total+=pp.length+(numQ(cc)-1); // extra questions
    if(i<ci){done+=pp.length+(numQ(cc)-1);}
    else if(i===ci){
      done+=pi;
      if(p==='quiz')done+=qi;
    }
  });
  const pct=Math.round((done/total)*100);
  document.getElementById('tbFill').style.width=pct+'%';
  document.getElementById('tbLabel').textContent=`Concept ${ci+1} of ${C.length}`;
  document.getElementById('tbConcept').textContent=c.title;
  document.getElementById('tbPage').textContent={learn:'Learn',do:'Do it now',quiz:'Quiz'}[p];
  document.getElementById('btnPrev').disabled=ci===0&&pi===0;
  // Next gating
  let locked=false;
  if(p==='do')locked=!doChecks[ci]||!doChecks[ci].every(Boolean);
  if(p==='quiz')locked=!quizPassed[ci];
  const isLast=ci===C.length-1&&pi===ps.length-1;
  document.getElementById('btnNext').disabled=isLast||locked;
  document.getElementById('btnNext').textContent=isLast?'✓ Done':'Next →';
  const typeLabel={learn:'Learn',do:'Do it now',quiz:`Quiz · Q${qi+1}/${nq}`}[p];
  document.getElementById('botLabel').textContent=`Concept ${ci+1} · Page ${pi+1}`;
  document.getElementById('botSub').textContent=typeLabel;
}

// ─── INTERACTIONS ────────────────────────────────────────────────────
function toggleStep(i){
  if(!doChecks[ci])doChecks[ci]=new Array(C[ci].do.steps.length).fill(false);
  doChecks[ci][i]=!doChecks[ci][i];
  save();render();
}

function answerQuiz(i){
  if(quizPassed[ci])return;
  const qi=quizQ[ci]||0;
  if((quizDone[ci]||[])[qi])return; // already passed this question
  const o=C[ci].quiz.questions[qi].opts[i];
  quizSel[ci]=i;
  if(o.c){
    if(!quizDone[ci])quizDone[ci]=new Array(numQ(C[ci])).fill(false);
    quizDone[ci][qi]=true;
    if(quizDone[ci].every(Boolean))quizPassed[ci]=true;
  }
  save();render();
}

function nextQuestion(){
  const nq=numQ(C[ci]);
  const qi=(quizQ[ci]||0)+1;
  if(qi<nq){quizQ[ci]=qi;quizSel[ci]=undefined;}
  save();render();
}

function nav(dir){
  const ps=pages(C[ci]);
  if(dir===1){if(pi<ps.length-1){pi++;}else if(ci<C.length-1){ci++;pi=0;}}
  else{if(pi>0){pi--;}else if(ci>0){ci--;pi=pages(C[ci]).length-1;}}
  save();render();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!document.getElementById('btnNext').disabled)nav(1);
  if(e.key==='ArrowLeft'&&!document.getElementById('btnPrev').disabled)nav(-1);
});

load();render();
</script>
